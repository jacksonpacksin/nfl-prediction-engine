name: NFL data refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '17 11,17,23 * * *'
permissions:
  contents: write
concurrency:
  group: nfl-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test v0.5 validation logic
        run: python -m unittest -v test_validation_v05.py test_market.py test_research_v07.py test_reconciliation.py test_identity_capture.py test_external_sources.py
      - name: Download and backtest NFL data
        run: python pipeline.py
      - name: Benchmark and validate v0.5 models
        run: python validation_v05.py
      - name: Capture point-in-time injuries and configured Kalshi orderbooks
        env:
          KALSHI_TICKERS: ${{ vars.KALSHI_TICKERS }}
        run: python market_capture.py
      - name: Discover candidate NFL passing-yard markets
        run: python market_discovery.py
      - name: Capture prospective pregame forecasts
        run: python pregame.py
      - name: Match candidate market names to GSIS player IDs
        run: python identity_matching.py
      - name: Fetch independently sourced starter confirmations
        env:
          NFL_STARTER_FEED_URL: ${{ vars.NFL_STARTER_FEED_URL }}
          NFL_STARTER_FEED_TOKEN: ${{ secrets.NFL_STARTER_FEED_TOKEN }}
        run: python starter_feed.py
      - name: Verify Kalshi contract fingerprints
        run: python contract_fingerprint.py
      - name: Check as-of starter and injury evidence
        run: python availability_evidence.py
      - name: Reconcile reviewed Kalshi contract rules
        run: python contract_reconciliation.py
      - name: Cross-check settled markets against NFL results
        run: python settlement_reconciliation.py
      - name: Paper execution and statistical edge status
        run: python execution_validation.py
      - name: Research-only fee-aware market evaluation
        run: python market_ev.py
      - name: Publish operational readiness report
        run: python research_readiness.py
      - name: Publish data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Automated NFL statistics refresh"
            git push
          fi
