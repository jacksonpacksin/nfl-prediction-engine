name: NFL data refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '17 11,17,23 * * *'
permissions:
  contents: write
concurrency:
  group: nfl-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test v0.5 validation logic
        run: python -m unittest -v test_validation_v05.py test_market.py
      - name: Download and backtest NFL data
        run: python pipeline.py
      - name: Benchmark and validate v0.5 models
        run: python validation_v05.py
      - name: Capture point-in-time injuries and configured Kalshi orderbooks
        env:
          KALSHI_TICKERS: ${{ vars.KALSHI_TICKERS }}
        run: python market_capture.py
      - name: Research-only fee-aware market evaluation
        run: python market_ev.py
      - name: Publish data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Automated NFL statistics refresh"
            git push
          fi
